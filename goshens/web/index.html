<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Goshen Dental Care - Creating Perfect Smiles">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Goshen Dental Care">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Goshen Dental Care</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f5f9fc;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #0d3b56;
      gap: 16px;
    }

    #loading .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #cce7f5;
      border-top-color: #0891b2;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading strong {
      font-size: 18px;
      font-weight: 600;
    }

    #loading span {
      font-size: 14px;
      color: #4b7c99;
    }

    #error {
      display: none;
      padding: 24px;
      color: #d32f2f;
      font-family: monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <strong>Goshen Dental Care</strong>
    <span>Loading app...</span>
  </div>
  <div id="error"></div>

  <script>
    window.addEventListener('error', function (event) {
      var loading = document.getElementById('loading');
      var errorBox = document.getElementById('error');
      if (loading) loading.style.display = 'none';
      if (errorBox) {
        errorBox.style.display = 'block';
        errorBox.innerHTML = '<h2>Unable to start the app</h2><p>' +
          (event.message || 'Unknown browser error') +
          '</p><p>Try refreshing the page or use Chrome/Edge.</p>';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
